<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janus 控制台</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b2230; --line:#242c3a;
  --text:#e7eaf0; --muted:#8b94a7; --accent:#5b8cff; --accent2:#3f6fe0;
  --ok:#2fbf71; --warn:#e0a03a; --err:#e2574c; --code:#0b0e13;
  --radius:10px; --shadow:0 8px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --panel2:#f0f3f9; --line:#dde3ee;
    --text:#182030; --muted:#5f6b82; --accent:#2f62d6; --accent2:#2450b5;
    --ok:#1a9c5b; --warn:#b57a12; --err:#c8412f; --code:#f3f5fa;
    --shadow:0 8px 24px rgba(20,32,60,.10);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.2px}
h1{font-size:20px}
h2{font-size:15px}
h3{font-size:13px}

/* ---------- 启动占位 ---------- */
.boot{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted)}

/* ---------- 布局 ---------- */
.shell{display:flex;min-height:100vh}
.side{
  width:212px;flex:0 0 212px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:9px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand .logo{
  width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#9b6bff);
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;
}
.brand .name{font-weight:600;letter-spacing:.4px}
.brand .ver{font-size:11px;color:var(--muted);margin-left:auto}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav .group{font-size:11px;color:var(--muted);padding:10px 10px 6px;text-transform:uppercase;letter-spacing:.8px}
.nav a{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  color:var(--text);font-size:13px;margin-bottom:2px;
}
.nav a:hover{background:var(--panel2);text-decoration:none}
.nav a.on{background:var(--panel2);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.nav a .ico{width:16px;text-align:center;opacity:.85}
.side .foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- 页头 ---------- */
.pagehead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:14px}
.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cardhead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.stat .v{font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.clickable{cursor:pointer;transition:border-color .15s}
.stat.clickable:hover{border-color:var(--accent)}

/* ---------- 按钮 ---------- */
button{
  font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);padding:6px 12px;cursor:pointer;transition:.14s;
}
button:hover{border-color:#38445c}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent2);border-color:var(--accent2)}
button.danger{color:var(--err);border-color:rgba(226,87,76,.35)}
button.danger:hover{background:rgba(226,87,76,.12)}
button.ghost{background:transparent}
button.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- 表格 ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.4px;background:var(--panel2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal}
.muted{color:var(--muted)}
.small{font-size:11.5px}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field > label{font-size:12px;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--muted)}
input,select,textarea{
  font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;outline:none;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical;min-height:88px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:720px){.formrow{grid-template-columns:1fr}}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline > input,.inline > select{width:auto;min-width:140px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:150px}

/* ---------- 标签 ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;
  font-size:11px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);
}
.badge.ok{color:var(--ok);border-color:rgba(47,191,113,.35);background:rgba(47,191,113,.1)}
.badge.warn{color:var(--warn);border-color:rgba(224,160,58,.35);background:rgba(224,160,58,.1)}
.badge.err{color:var(--err);border-color:rgba(226,87,76,.35);background:rgba(226,87,76,.1)}
.badge.acc{color:var(--accent);border-color:rgba(91,140,255,.35);background:rgba(91,140,255,.1)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)} .dot.err{background:var(--err)} .dot.warn{background:var(--warn)}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(4,7,12,.62);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:60;overflow-y:auto;
}
.modal{
  width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden;
}
.modal.wide{max-width:820px}
.modal .mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mhead h2{flex:1}
.modal .mbody{padding:16px 18px}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.x{background:none;border:none;font-size:18px;line-height:1;color:var(--muted);padding:0 4px}

/* ---------- 提示 ---------- */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);font-size:12.5px;max-width:420px;
  animation:slidein .18s ease-out;
}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--err)} .toast.warn{border-left-color:var(--warn)}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.alert{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--panel2);border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:12px}
.alert.err{border-left-color:var(--err)}
.alert.ok{border-left-color:var(--ok)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px}
pre.code{
  background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  overflow-x:auto;font-size:12px;line-height:1.5;margin:0;max-height:420px;
}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:12.5px}
.kv .k{color:var(--muted)}
.mono{font-size:12px}
.split{display:grid;grid-template-columns:1fr 340px;gap:14px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}

/* ---------- 登录 ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow)}
.loginbox .brand{padding:0 0 16px;border:none}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;border-radius:0;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
</style>
<script type="importmap">
{
  "imports": {
    "preact": "/assets/vendor/preact.module.js",
    "preact/hooks": "/assets/vendor/hooks.module.js",
    "htm": "/assets/vendor/htm.module.js"
  }
}
</script>
</head>
<body>
<div id="app"><div class="boot">正在加载控制台…</div></div>

</body>
