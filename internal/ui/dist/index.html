<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Janus 控制台</title>
    <script>
      // 先于 React 应用主题，避免刷新时闪白。
      try {
        var stored = localStorage.getItem("janus-theme");
        var dark = stored === "dark" || (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/ui/assets/index-BU7Y8wcK.js"></script>
    <link rel="stylesheet" crossorigin href="/ui/assets/index-B21n-gM5.css">
  </head>

    <div id="root"></div>
  </body>
</html>
